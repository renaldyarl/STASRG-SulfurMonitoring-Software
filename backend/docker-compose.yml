name: sulfur_monitoring_stack
version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sulfur_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Hanya expose port internal container (5432) ke network db_net, TIDAK expose ke Host/Internet
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - db_net

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sulfur_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      API_SECRET_KEY: ${API_SECRET_KEY}
    # Mount kode backend agar langsung ter-update (Hot-Reload) saat diedit di IDE/VSCode
    volumes:
      - .:/app
    # Mengaktifkan reload uvicorn
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    # Hanya expose port internal container (8000) ke network internal_net untuk Nginx
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal_net
      - db_net
    # Docker Compose Watch (Otomatis sync tanpa build ulang)
    develop:
      watch:
        - action: sync
          path: .
          target: /app
          ignore:
            - .venv/
            - __pycache__/
            - .ruff_cache/
        - action: rebuild
          path: requirements.txt

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: sulfur_frontend
    restart: unless-stopped
    # HANYA Frontend / Nginx yang membuka port ke Publik / Host
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - internal_net
    # Docker Compose Watch: otomatis build ulang frontend hanya jika file source/config berubah
    develop:
      watch:
        - action: rebuild
          path: ../frontend/src
        - action: rebuild
          path: ../frontend/package.json
        - action: rebuild
          path: ../frontend/nginx.conf

volumes:
  pgdata:

networks:
  internal_net:
    driver: bridge
  db_net:
    driver: bridge
    internal: true

    
